name: Build macOS DMG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

permissions:
  contents: read

jobs:
  build-apple-silicon-dmg:
    # GitHub's macos-14 hosted runner is Apple Silicon.
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Unpack desktop source
        run: |
          mkdir source
          unzip -q 拼豆图纸工作台_v0.21.0_macos_dmg_source.zip -d source

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/desktop/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build desktop DMG
        working-directory: source
        run: |
             brew install coreutils
             PATH="$(brew --prefix coreutils)/libexec/gnubin:$PATH" bash desktop/build-macos-arm64.sh
      - name: Verify DMG was produced
        run: |
          test -n "$(find source/desktop/dist -maxdepth 1 -name '*.dmg' -print -quit)"
          shasum -a 256 source/desktop/dist/*.dmg | tee source/desktop/dist/SHA256SUMS.txt

      - name: Upload unsigned DMG
        uses: actions/upload-artifact@v4
        with:
          name: 拼豆图纸工作台-v0.21.0-macOS-arm64
          path: |
            source/desktop/dist/*.dmg
            source/desktop/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
